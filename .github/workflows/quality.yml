name: QUALITY

on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

env:
  HUSKY: 0

jobs:
  quality-pr:
    name: Quality Changed (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Node and pnpm versions both come from .tool-versions
      - uses: agrimetrics/actions-dsp3/setup-node@v1
        with:
          package-manager: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # The committed .npmrc reads the @agrimetrics registry token from this
          GITHUB_PACKAGES_TOKEN: ${{ secrets.AGM_GITHUB_PACKAGES_TOKEN }}

      - name: Refresh origin main reference
        run: git fetch origin main:refs/remotes/origin/main

      - name: Run quality pipeline (changed only)
        run: pnpm run quality:ci:changed

  quality-main:
    name: Quality Full (Main)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Node and pnpm versions both come from .tool-versions
      - uses: agrimetrics/actions-dsp3/setup-node@v1
        with:
          package-manager: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # The committed .npmrc reads the @agrimetrics registry token from this
          GITHUB_PACKAGES_TOKEN: ${{ secrets.AGM_GITHUB_PACKAGES_TOKEN }}

      - name: Run quality pipeline
        run: pnpm run quality:ci
