name: QUALITY

on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

env:
  HUSKY: 0

jobs:
  quality-pr:
    name: Quality Changed (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Node and pnpm versions both come from .tool-versions
      - uses: agrimetrics/actions-dsp3/setup-node@v1
        with:
          package-manager: pnpm

      - name: Configure GitHub Packages registry auth
        # pnpm 11 won't expand env vars in a repo-committed .npmrc (anti-supply-chain-attack
        # protection), so the token goes in the runner's user-level ~/.npmrc instead; the
        # committed .npmrc keeps only the @agrimetrics scope.
        run: echo "//npm.pkg.github.com/:_authToken=${AGM_GITHUB_PACKAGES_TOKEN}" >> ~/.npmrc
        env:
          AGM_GITHUB_PACKAGES_TOKEN: ${{ secrets.AGM_GITHUB_PACKAGES_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh origin main reference
        run: git fetch origin main:refs/remotes/origin/main

      - name: Run quality pipeline (changed only)
        run: pnpm run quality:ci:changed

  quality-main:
    name: Quality Full (Main)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Node and pnpm versions both come from .tool-versions
      - uses: agrimetrics/actions-dsp3/setup-node@v1
        with:
          package-manager: pnpm

      - name: Configure GitHub Packages registry auth
        # pnpm 11 won't expand env vars in a repo-committed .npmrc (anti-supply-chain-attack
        # protection), so the token goes in the runner's user-level ~/.npmrc instead; the
        # committed .npmrc keeps only the @agrimetrics scope.
        run: echo "//npm.pkg.github.com/:_authToken=${AGM_GITHUB_PACKAGES_TOKEN}" >> ~/.npmrc
        env:
          AGM_GITHUB_PACKAGES_TOKEN: ${{ secrets.AGM_GITHUB_PACKAGES_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality pipeline
        run: pnpm run quality:ci
